<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffc3a0,#ff9a9e);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:850px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:35px;
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    position:relative;
    z-index:5;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:40px;
}

.intro{
    text-align:center;
    font-size:18px;
}

button{
    display:block;
    margin:25px auto;
    padding:14px 35px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4f87;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.08);
}

#letter{
    display:none;
    margin-top:20px;
    font-size:18px;
    line-height:1.9;
    white-space:pre-wrap;
}

.signature{
    text-align:right;
    margin-top:45px;
    font-size:22px;
    color:#fff;
    font-style:italic;
    opacity:0;
    transition:1s;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.2;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

.heart{
    position:absolute;
    color:white;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-120vh);
        opacity:1;
    }
}
</style>

</head>
<body>

<div class="card">

<h1>🎂 Happy Birthday 🎂</h1>

<p class="intro">
I made something for you.<br><br>
Click the button below.
</p>

<button onclick="showLetter()">💌 Open Letter</button>

<div id="letter"></div>

<div class="signature" id="signature">
Love ❤️<br>
07-24-2026
</div>

</div>

<script>

const text=`Hi?

First thing first Happy happy birthday, to the person who I once called mine.

Although we don't talk, I wish and pray you achieve everything you hope for.

Despite our past I want you to know I will keep my promise, I will continue to support you even if not necessary and cheer silently.

I don't really know where we stand now, but I do know one thing, you were once someone very important in my life. Until this day you are still very important in my life, and that feeling will never disappear just like that.

I hope today you feel appreciated, loved, and at peace, even if that peace doesn't come from me anymore.

Thank you for all the memories we shared and know I will treasure them forever.

Can't bring myself to deliver this message to you personally out of respect, nakng sad pd.

Even though we went our separate ways, I hope you know how much you meant to me.

Dri nlng cguro taman kay murag hurot na akoa luha HAHAHAHAHAHHA.

Sorry if ma late nako ni og hatag sa imoha. Unta dawaton ghapon nimo.

Once again,

Happy Birthday 🫶`;

function showLetter(){

    const letter=document.getElementById("letter");
    letter.style.display="block";
    letter.innerHTML="";

    let i=0;

    function type(){

        if(i<text.length){

            letter.innerHTML+=text.charAt(i);
            i++;

            setTimeout(type,25);

        }else{

            document.getElementById("signature").style.opacity="1";

        }

    }

    type();

}

// Twinkling stars
for(let i=0;i<120;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";
    star.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(star);

}

// Floating hearts
setInterval(()=>{

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(18+Math.random()*20)+"px";

    heart.style.animationDuration=(6+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);

},500);

</script>

</body>
</html>
